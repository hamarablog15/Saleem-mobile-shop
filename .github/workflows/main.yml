name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f SaleemMobileShopUdhaar/settings.gradle.kts ]; then
            echo "PROJECT_DIR=SaleemMobileShopUdhaar" >> "$GITHUB_ENV"
          else
            echo "Android project files not found"
            exit 1
          fi

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saleem-Mobile-Shop-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
