name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Android project
        run: |
          unzip -o SaleemMobileShopUdhaar_Android_Project.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Find Android project
        id: project
        run: |
          FILE=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts ZIP mein nahi mili"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: .
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saleem-Mobile-Shop-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
